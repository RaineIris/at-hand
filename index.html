const $=id=>document.getElementById(id);let db,items=[],folders=JSON.parse(localStorage.getItem('folders')||'[]'),filter='全部',current=null,sequence=[],url,thumbUrls=[],s=1,x=0,y=0,w=0,h=0,points=new Map(),gesture=null,dirty=false;
let toastTimer;function notify(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3200)}function ask(title,message,input=false){return new Promise(resolve=>{let d=$('custom');$('customTitle').textContent=title;$('customText').textContent=message;$('customText').hidden=!message;$('customInput').hidden=!input;$('customInput').value='';$('customInput').placeholder='输入图夹名称';d.returnValue='cancel';d.addEventListener('close',()=>resolve(d.returnValue==='ok'?(input?$('customInput').value:true):null),{once:true});d.showModal()})}const req=indexedDB.open('at-hand',1);req.onupgradeneeded=()=>req.result.createObjectStore('images',{keyPath:'id'});req.onsuccess=()=>{db=req.result;refresh().then(()=>{let id=localStorage.getItem('resume');if(id&&items.some(a=>a.id===id))openImage(id)})};req.onerror=()=>notify('本地存储打开失败');
