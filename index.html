function tile(a){let b=document.createElement('button');b.className='tile';let im=document.createElement('img');let u=URL.createObjectURL(a.blob);thumbUrls.push(u);im.src=u;im.loading='lazy';b.setAttribute('aria-label','查看图片');im.alt='';b.append(im);let timer,start,held=false;b.onpointerdown=e=>{held=false;start=[e.clientX,e.clientY];timer=setTimeout(()=>{held=true;manage(a)},480)};b.onpointermove=e=>{if(start&&Math.hypot(e.clientX-start[0],e.clientY-start[1])>10)clearTimeout(timer)};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>clearTimeout(timer);b.oncontextmenu=e=>{e.preventDefault();clearTimeout(timer);if(!held){held=true;manage(a)}};b.onclick=()=>{if(!held)openImage(a.id);held=false};return b}
async function thumbnail(f){try{let b=await createImageBitmap(f,{resizeWidth:320,resizeQuality:'high'});let c=document.createElement('canvas');c.width=b.width;c.height=b.height;let ctx=c.getContext('2d');ctx.drawImage(b,0,0);b.close();return await new Promise(r=>c.toBlob(r,'image/webp',.8))}catch{return null}}
$('homeNav').onclick=()=>{page='home';render();window.scrollTo(0,0)};$('libraryNav').onclick=()=>{page='library';render();window.scrollTo(0,0)};$('add').onclick=()=>$('files').click();$('files').onchange=async()=>{try{for(let f of $('files').files){await put({id:crypto.randomUUID(),blob:f,category:page==='home'||filter==='全部'?'':filter,created:Date.now(),pin:page==='home'})}await refresh()}catch(e){notify('导入失败，可能是存储空间不足')}finally{$('files').value=''}};
$('folder').onclick=async()=>{let f=(await ask('新建图夹','',true))?.trim();if(f&&f!=='全部'&&!folders.includes(f)){folders.push(f);localStorage.setItem('folders',JSON.stringify(folders));filter=f;render()}};
function persist(){if(!current||!w||!dirty)return;current.view={s,x,y,vw:$('stage').clientWidth,vh:$('stage').clientHeight};dirty=false;put(current).catch(()=>notify('阅读位置保存失败'))}
function paint(){let v=$('stage');x=Math.min(Math.max(x,Math.min(0,v.clientWidth-w*s)),Math.max(0,(v.clientWidth-w*s)/2));y=Math.min(Math.max(y,Math.min(0,v.clientHeight-h*s)),Math.max(0,(v.clientHeight-h*s)/2));if(w*s<v.clientWidth)x=(v.clientWidth-w*s)/2;if(h*s<v.clientHeight)y=(v.clientHeight-h*s)/2;$('photo').style.transform='translate('+x+'px,'+y+'px) scale('+s+')';$('status').textContent='原图 · '+Math.round(s*100)+'% · '+(sequence.indexOf(current.id)+1)+' / '+sequence.length}
function openImage(id){persist();current=items.find(a=>a.id===id);if(!current)return;sequence=items.filter(a=>page==='home'?a.pin:filter==='全部'||a.category===filter).map(a=>a.id);if(!sequence.includes(id))sequence=items.map(a=>a.id);$('viewer').hidden=false;$('viewer').classList.remove('quiet');$('name').textContent=(sequence.indexOf(current.id)+1)+' / '+sequence.length;localStorage.setItem('resume',id);if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(current.blob);w=h=0;$('photo').onload=()=>{w=$('photo').naturalWidth;h=$('photo').naturalHeight;let v=current.view;s=v?.s||Math.min($('stage').clientWidth/w,1);x=v?.x||0;y=v?.y||0;paint()};$('photo').src=url;let i=sequence.indexOf(id);$('prev').disabled=i===0;$('next').disabled=i===sequence.length-1}
$('prev').onclick=()=>openImage(sequence[sequence.indexOf(current.id)-1]);$('next').onclick=()=>openImage(sequence[sequence.indexOf(current.id)+1]);$('back').onclick=()=>{persist();$('viewer').hidden=true;localStorage.removeItem('resume');current=null;refresh()};
let st=$('stage');function center(){let p=[...points.values()];return p.length===1?{x:p[0].x,y:p[0].y,d:0}:{x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2,d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}}let moved=false,swipe=null;st.onpointerdown=e=>{st.setPointerCapture(e.pointerId);if(!points.size){moved=false;swipe={x:e.clientX,y:e.clientY,t:performance.now(),left:x>=-2,right:x+w*s<=st.clientWidth+2,multi:false}}else if(swipe)swipe.multi=true;points.set(e.pointerId,{x:e.clientX,y:e.clientY});gesture=center();if(points.size>1)moved=true};st.onpointermove=e=>{if(!points.has(e.pointerId)||!w)return;points.set(e.pointerId,{x:e.clientX,y:e.clientY});let c=center();if(Math.abs(c.x-gesture.x)+Math.abs(c.y-gesture.y)>2)moved=true;let ns=gesture.d&&c.d?Math.max(Math.min(st.clientWidth/w,st.clientHeight/h)*.5,Math.min(8,s*c.d/gesture.d)):s;x=c.x-(gesture.x-x)*ns/s;y=c.y-(gesture.y-y)*ns/s;s=ns;gesture=c;dirty=true;paint()};function end(e){points.delete(e.pointerId);if(points.size)gesture=center();else{let a=swipe;swipe=null;if(a&&!a.multi&&e.type==='pointerup'&&w){let dx=e.clientX-a.x,dy=e.clientY-a.y;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.6&&performance.now()-a.t<850&&((dx>0&&a.left)||(dx<0&&a.right))){let id=sequence[sequence.indexOf(current.id)+(dx>0?-1:1)];if(id){persist();openImage(id);return}}}if(!moved&&e.type==='pointerup')$('viewer').classList.toggle('quiet');persist()}}st.onpointerup=end;st.onpointercancel=end;st.onwheel=e=>{e.preventDefault();if(!w)return;let ns=Math.max(.02,Math.min(8,s*Math.exp(-e.deltaY*.002)));x=e.clientX-(e.clientX-x)*ns/s;y=e.clientY-(e.clientY-y)*ns/s;s=ns;dirty=true;paint();persist()};document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});window.addEventListener('pagehide',persist);
let selected=null;function manage(a){persist();selected=a;let d=$('dlg');$('pin').textContent=a.pin?'移出正在使用':'加入正在使用';$('folderChoices').replaceChildren();for(let folder of ['',...folders]){let b=document.createElement('button');b.className='choice'+(a.category===folder?' chosen':'');let label=document.createElement('span');label.textContent=folder||'未分类';let mark=document.createElement('span');mark.textContent=a.category===folder?'✓':'';b.append(label,mark);b.onclick=async()=>{a.category=folder;await put(a);d.close();render();notify('已移动')};$('folderChoices').append(b)}if(!d.open)d.showModal()}$('edit').onclick=()=>manage(current);$('closeSheet').onclick=()=>$('dlg').close();$('dlg').onclick=e=>{if(e.target===$('dlg'))$('dlg').close()};$('pin').onclick=async()=>{selected.pin=!selected.pin;await put(selected);$('dlg').close();render();notify(selected.pin?'已加入正在使用':'已移出正在使用')};$('remove').onclick=async()=>{let a=selected;$('dlg').close();if(await ask('删除图片','将这张图片从手边移除？')){await new Promise((ok,no)=>{let t=db.transaction('images','readwrite');t.objectStore('images').delete(a.id);t.oncomplete=ok;t.onerror=no});if(current?.id===a.id){$('viewer').hidden=true;current=null;localStorage.removeItem('resume')}await refresh();notify('已删除')}};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(console.error);
</script></html>
