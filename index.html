<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f6f2"><link rel="manifest" href="manifest.json"><title>手边</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f2;color:#292d28;font:15px system-ui,sans-serif}button,input,select{font:inherit}button{border:0;background:transparent;color:inherit;cursor:pointer;padding:12px;transition:opacity .12s}button:active{opacity:.55}main{max-width:760px;margin:auto;padding:32px 20px 110px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:34px;letter-spacing:3px;margin:0}small{color:#777e73}h2{font-size:16px;margin-top:32px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{padding:0;text-align:left;overflow:hidden;min-width:0}.tile img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#e8e9e2;border-radius:8px;display:block}.tile span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:8px}.add{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));right:24px;background:#465a48;color:white;border-radius:50%;width:58px;height:58px;font-size:28px;box-shadow:0 4px 16px #0002}.empty{padding:48px 0;color:#81877e;text-align:center}.filters{display:flex;gap:8px;overflow:auto;margin-top:24px}.filters button{white-space:nowrap;border-bottom:2px solid transparent}.filters .active{border-color:#465a48;color:#465a48}.viewer{position:fixed;inset:0;background:#171917;color:white;z-index:10;overflow:hidden;touch-action:none}.viewer[hidden]{display:none}#stage{position:absolute;inset:0;overflow:hidden;touch-action:none}#photo{position:absolute;max-width:none;transform-origin:0 0;pointer-events:none;user-select:none}.bar{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;display:flex;align-items:center;background:#171917b8;gap:8px}.bar div{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.arrow{position:absolute;top:50%;transform:translateY(-50%);background:#2229;border-radius:50%;width:40px;height:40px;padding:0;font-size:28px}.arrow:disabled{opacity:.2}.left{left:8px}.right{right:8px}.foot{position:absolute;bottom:env(safe-area-inset-bottom);left:0;right:0;text-align:center;padding:12px;background:#17191799;font-size:12px}.quiet .chrome{display:none}dialog{border:0;border-radius:14px;padding:20px;width:min(90vw,360px);color:#292d28}dialog input{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:6px}dialog::backdrop{background:#0006}
</style><main><header><div><small>随时翻阅，随手放下</small><h1>手边</h1></div><button id="folder">＋ 图夹</button></header><nav class="filters" id="filters"></nav><section id="recent"></section><h2 id="heading">全部图片</h2><div class="grid" id="grid"></div><button class="add" id="add" aria-label="添加图片">＋</button><input type="file" id="files" accept="image/*" multiple hidden></main><section class="viewer" id="viewer" hidden><div id="stage"><img id="photo" draggable="false"></div><div class="bar chrome"><button id="back">‹ 返回</button><div id="name"></div><button id="edit">···</button></div><button class="arrow left chrome" id="prev" aria-label="上一张">‹</button><button class="arrow right chrome" id="next" aria-label="下一张">›</button><div class="foot chrome" id="status"></div></section><dialog id="dlg"><form method="dialog"><h3>图片设置</h3><label>名称<input id="rename"></label><label>图夹<input id="category" list="cats"><datalist id="cats"></datalist></label><button id="pin" type="button"></button><button id="remove" type="button">删除图片</button><button value="cancel">取消</button><button id="save" value="default">保存</button></form></dialog><script>
const $=id=>document.getElementById(id);let db,items=[],folders=JSON.parse(localStorage.getItem('folders')||'[]'),filter='全部',current=null,sequence=[],url,thumbUrls=[],s=1,x=0,y=0,w=0,h=0,points=new Map(),gesture=null,dirty=false;
const req=indexedDB.open('at-hand',1);req.onupgradeneeded=()=>req.result.createObjectStore('images',{keyPath:'id'});req.onsuccess=()=>{db=req.result;refresh().then(()=>{let id=localStorage.getItem('resume');if(id&&items.some(a=>a.id===id))openImage(id)})};req.onerror=()=>alert('本地存储打开失败');
function store(mode='readonly'){return db.transaction('images',mode).objectStore('images')}function put(a){return new Promise((ok,no)=>{let t=db.transaction('images','readwrite');t.objectStore('images').put(a);t.oncomplete=ok;t.onerror=no;t.onabort=no})}function refresh(){return new Promise(ok=>{let q=store().getAll();q.onsuccess=()=>{items=q.result.sort((a,b)=>b.created-a.created);render();ok()}})}
function render(){thumbUrls.forEach(URL.revokeObjectURL);thumbUrls=[];$('filters').replaceChildren();for(let f of ['全部',...folders]){let b=document.createElement('button');b.textContent=f;b.className=f===filter?'active':'';b.onclick=()=>{filter=f;render()};$('filters').append(b)}let list=items.filter(a=>filter==='全部'||a.category===filter);$('heading').textContent=filter==='全部'?'全部图片':filter;$('grid').replaceChildren();list.forEach(a=>$('grid').append(tile(a)));if(!list.length){let e=document.createElement('div');e.className='empty';e.textContent='还没有图片，点击 ＋ 添加';$('grid').append(e)}$('recent').replaceChildren();let pins=items.filter(a=>a.pin);if(pins.length&&filter==='全部'){let h=document.createElement('h2');h.textContent='正在使用';let g=document.createElement('div');g.className='grid';pins.forEach(a=>g.append(tile(a)));$('recent').append(h,g)}}
function tile(a){let b=document.createElement('button');b.className='tile';let im=document.createElement('img');let u=URL.createObjectURL(a.thumb||a.blob);thumbUrls.push(u);im.src=u;im.loading='lazy';let t=document.createElement('span');t.textContent=a.name;b.append(im,t);b.onclick=()=>openImage(a.id);return b}
async function thumbnail(f){try{let b=await createImageBitmap(f,{resizeWidth:320,resizeQuality:'high'});let c=document.createElement('canvas');c.width=b.width;c.height=b.height;let ctx=c.getContext('2d');ctx.drawImage(b,0,0);b.close();return await new Promise(r=>c.toBlob(r,'image/webp',.8))}catch{return null}}
$('add').onclick=()=>$('files').click();$('files').onchange=async()=>{try{for(let f of $('files').files){await put({id:crypto.randomUUID(),name:f.name.replace(/\.[^.]+$/,''),blob:f,thumb:await thumbnail(f),category:filter==='全部'?'':filter,created:Date.now(),pin:false})}await refresh()}catch(e){alert('导入失败，可能是存储空间不足')}finally{$('files').value=''}};
$('folder').onclick=()=>{let f=prompt('图夹名称')?.trim();if(f&&f!=='全部'&&!folders.includes(f)){folders.push(f);localStorage.setItem('folders',JSON.stringify(folders));filter=f;render()}};
function persist(){if(!current||!w||!dirty)return;current.view={s,x,y,vw:$('stage').clientWidth,vh:$('stage').clientHeight};dirty=false;put(current).catch(()=>alert('阅读位置保存失败'))}
function paint(){let v=$('stage');x=Math.min(Math.max(x,Math.min(0,v.clientWidth-w*s)),Math.max(0,(v.clientWidth-w*s)/2));y=Math.min(Math.max(y,Math.min(0,v.clientHeight-h*s)),Math.max(0,(v.clientHeight-h*s)/2));if(w*s<v.clientWidth)x=(v.clientWidth-w*s)/2;if(h*s<v.clientHeight)y=(v.clientHeight-h*s)/2;$('photo').style.transform='translate('+x+'px,'+y+'px) scale('+s+')';$('status').textContent='原图 · '+Math.round(s*100)+'% · '+(sequence.indexOf(current.id)+1)+' / '+sequence.length}
function openImage(id){persist();current=items.find(a=>a.id===id);if(!current)return;sequence=items.filter(a=>filter==='全部'||a.category===filter).map(a=>a.id);if(!sequence.includes(id))sequence=items.map(a=>a.id);$('viewer').hidden=false;$('viewer').classList.remove('quiet');$('name').textContent=current.name;localStorage.setItem('resume',id);if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(current.blob);w=h=0;$('photo').onload=()=>{w=$('photo').naturalWidth;h=$('photo').naturalHeight;let v=current.view;s=v?.s||Math.min($('stage').clientWidth/w,1);x=v?.x||0;y=v?.y||0;paint()};$('photo').src=url;let i=sequence.indexOf(id);$('prev').disabled=i===0;$('next').disabled=i===sequence.length-1}
$('prev').onclick=()=>openImage(sequence[sequence.indexOf(current.id)-1]);$('next').onclick=()=>openImage(sequence[sequence.indexOf(current.id)+1]);$('back').onclick=()=>{persist();$('viewer').hidden=true;localStorage.removeItem('resume');current=null;refresh()};
let st=$('stage');function center(){let p=[...points.values()];return p.length===1?{x:p[0].x,y:p[0].y,d:0}:{x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2,d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}}let moved=false;st.onpointerdown=e=>{st.setPointerCapture(e.pointerId);if(!points.size)moved=false;points.set(e.pointerId,{x:e.clientX,y:e.clientY});gesture=center();if(points.size>1)moved=true};st.onpointermove=e=>{if(!points.has(e.pointerId)||!w)return;points.set(e.pointerId,{x:e.clientX,y:e.clientY});let c=center();if(Math.abs(c.x-gesture.x)+Math.abs(c.y-gesture.y)>2)moved=true;let ns=gesture.d&&c.d?Math.max(Math.min(st.clientWidth/w,st.clientHeight/h)*.5,Math.min(8,s*c.d/gesture.d)):s;x=c.x-(gesture.x-x)*ns/s;y=c.y-(gesture.y-y)*ns/s;s=ns;gesture=c;dirty=true;paint()};function end(e){points.delete(e.pointerId);if(points.size)gesture=center();else{if(!moved&&e.type==='pointerup')$('viewer').classList.toggle('quiet');persist()}}st.onpointerup=end;st.onpointercancel=end;st.onwheel=e=>{e.preventDefault();if(!w)return;let ns=Math.max(.02,Math.min(8,s*Math.exp(-e.deltaY*.002)));x=e.clientX-(e.clientX-x)*ns/s;y=e.clientY-(e.clientY-y)*ns/s;s=ns;dirty=true;paint();persist()};document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});window.addEventListener('pagehide',persist);
$('edit').onclick=()=>{$('rename').value=current.name;$('category').value=current.category;$('cats').replaceChildren(...folders.map(f=>{let o=document.createElement('option');o.value=f;return o}));$('pin').textContent=current.pin?'移出正在使用':'加入正在使用';$('dlg').showModal()};$('pin').onclick=async()=>{current.pin=!current.pin;await put(current);$('dlg').close();render()};$('save').onclick=async()=>{current.name=$('rename').value.trim()||current.name;current.category=$('category').value.trim();if(current.category&&!folders.includes(current.category)){folders.push(current.category);localStorage.setItem('folders',JSON.stringify(folders))}await put(current);$('name').textContent=current.name;render()};$('remove').onclick=()=>{if(confirm('删除手边中的这张图片？')){store('readwrite').delete(current.id);$('dlg').close();$('viewer').hidden=true;current=null;localStorage.removeItem('resume');refresh()}};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(console.error);
</script></html>
